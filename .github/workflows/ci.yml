name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Fedora 45 has the LLVM 23 that bpf-linker 0.13 links against.
    container: fedora:45
    env:
      NIGHTLY: nightly-2026-11-21
      CARGO_TERM_COLOR: always
    steps:
      - name: Install system packages
        run: dnf install -y --setopt=install_weak_deps=False git gcc clang llvm llvm-devel zlib-devel libzstd-devel libxml2-devel findutils
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install toolchains
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/bpf-linker
          key: bpf-linker-0.13.0-fedora45
      - name: Install bpf-linker
        run: command -v bpf-linker || cargo install bpf-linker@0.13.0 --locked
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Package
        run: scripts/publish.sh --dry-run
      - name: Static binaries
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for arch in x86_64 aarch64; do
            cargo build --release --target "$arch-unknown-linux-musl"
            cp "target/$arch-unknown-linux-musl/release/netleash" "netleash-$arch"
            llvm-strip "netleash-$arch"
            sha256sum "netleash-$arch" > "netleash-$arch.sha256"
          done
          # The name releases up to 0.2.1 used for the x86_64 binary.
          cp netleash-x86_64 netleash
          sha256sum netleash > netleash.sha256
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            netleash-x86_64
            netleash-x86_64.sha256
            netleash-aarch64
            netleash-aarch64.sha256
            netleash
            netleash.sha256
