[package]
name = "netleash-common"
version = "0.1.0"
edition = "2024"
description = "Map types shared by netleash's eBPF programs and its userspace"
license = "MIT"
repository = "https://github.com/sigmaSd/netleash"
keywords = ["ebpf", "netleash"]

[features]
default = []
# Implement aya::Pod so userspace can use these types as map keys and values.
user = ["dep:aya"]

[dependencies]
aya = { version = "0.16", optional = true }
