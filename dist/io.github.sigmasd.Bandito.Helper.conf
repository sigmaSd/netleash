<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Installed in /usr/share/dbus-1/system.d/. -->
<busconfig>
  <!-- Only root runs the service. -->
  <policy user="root">
    <allow own="io.github.sigmasd.Bandito.Helper"/>
  </policy>
  <!-- Anyone may call it; polkit decides who may change settings. -->
  <policy context="default">
    <allow send_destination="io.github.sigmasd.Bandito.Helper"/>
    <allow receive_sender="io.github.sigmasd.Bandito.Helper"/>
  </policy>
</busconfig>
