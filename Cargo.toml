[package]
name = "netleash"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
description = "See and limit network traffic per app on Linux, with eBPF"
license = "MIT"
repository = "https://github.com/sigmaSd/netleash"
readme = "README.md"
keywords = ["ebpf", "bandwidth", "network", "traffic-shaping", "linux"]
categories = ["command-line-utilities", "network-programming", "os::linux-apis"]
# The eBPF sources stay out: the package ships their compiled object
# (scripts/publish.sh builds it), so installing needs no nightly Rust.
include = [
  "/src",
  "/build.rs",
  "/netleash.bpf.o",
  "/dist",
  "/scripts/install.sh",
  "/README.md",
  "/LICENSE",
]

[workspace]
members = ["common", "ebpf"]
# The eBPF crate only builds for the BPF target, through build.rs.
default-members = [".", "common"]

[dependencies]
anyhow = "1.0.104"
aya = "0.16"
netleash-common = { version = "0.1.0", path = "common", features = ["user"] }
dns-lookup = "4.0.2"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
caps = "0.5"

[dev-dependencies]
aya-obj = "0.6"
