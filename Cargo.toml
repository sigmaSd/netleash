[package]
name = "bandito-helper"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["common", "ebpf"]
# The eBPF crate only builds for the BPF target, through build.rs.
default-members = [".", "common"]

[dependencies]
anyhow = "1.0.104"
aya = "0.16"
bandito-helper-common = { path = "common", features = ["user"] }
dns-lookup = "4.0.2"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
aya-obj = "0.6"

[profile.release.package.bandito-helper-ebpf]
debug = 2
codegen-units = 1
